<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SecureAuth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- ═══ Background Decoration ═══ -->
    <div class="bg-decoration">
        <div class="bg-circle bg-circle--1"></div>
        <div class="bg-circle bg-circle--2"></div>
        <div class="bg-circle bg-circle--3"></div>
    </div>

    <div class="auth-container">
        <!-- ═══ Left Panel — Branding ═══ -->
        <div class="auth-brand">
            <div class="auth-brand__content">
                <div class="auth-brand__logo">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="url(#logo-gradient)"/>
                        <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>SecureAuth</span>
                </div>
                <h1 class="auth-brand__title">Welcome Back</h1>
                <p class="auth-brand__subtitle">
                    Your secure gateway to the dashboard. Log in to access your protected workspace.
                </p>
                <div class="auth-brand__features">
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">🔒</span>
                        <span>SHA-256 Password Hashing</span>
                    </div>
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">🛡️</span>
                        <span>Protected Routes</span>
                    </div>
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">⚡</span>
                        <span>Instant Authentication</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ Right Panel — Login Form ═══ -->
        <div class="auth-form-panel">
            <div class="auth-form-wrapper">
                <div class="auth-form-header">
                    <h2 class="auth-form-title">Sign In</h2>
                    <p class="auth-form-subtitle">Enter your credentials to continue</p>
                </div>

                <!-- Alert Box -->
                <div class="alert" id="alertBox">
                    <span class="alert__icon" id="alertIcon"></span>
                    <span class="alert__message" id="alertMessage"></span>
                    <button class="alert__close" onclick="hideAlert()">&times;</button>
                </div>

                <form class="auth-form" id="loginForm" novalidate>
                    <!-- Email Field -->
                    <div class="form-group" id="emailGroup">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="form-toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="passwordError"></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn--primary btn--full" id="loginBtn">
                        <span class="btn__text">Sign In</span>
                        <span class="btn__loader" id="loginLoader">
                            <svg class="spinner" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="auth-form-footer">
                    <p>Don't have an account? <a href="register.html" class="link">Create one</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
