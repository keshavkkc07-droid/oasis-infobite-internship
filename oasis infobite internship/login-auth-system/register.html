<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SecureAuth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- ═══ Background Decoration ═══ -->
    <div class="bg-decoration">
        <div class="bg-circle bg-circle--1"></div>
        <div class="bg-circle bg-circle--2"></div>
        <div class="bg-circle bg-circle--3"></div>
    </div>

    <div class="auth-container">
        <!-- ═══ Left Panel — Branding ═══ -->
        <div class="auth-brand auth-brand--register">
            <div class="auth-brand__content">
                <div class="auth-brand__logo">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="url(#logo-gradient2)"/>
                        <path d="M20 12V28M12 20H28" stroke="white" stroke-width="3" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logo-gradient2" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#8b5cf6"/>
                                <stop offset="1" stop-color="#ec4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>SecureAuth</span>
                </div>
                <h1 class="auth-brand__title">Join Us Today</h1>
                <p class="auth-brand__subtitle">
                    Create your account in seconds. Your data is protected with industry-standard encryption.
                </p>
                <div class="auth-brand__features">
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">✅</span>
                        <span>Free to register</span>
                    </div>
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">🔐</span>
                        <span>Passwords never stored in plain text</span>
                    </div>
                    <div class="auth-brand__feature">
                        <span class="auth-brand__feature-icon">🚀</span>
                        <span>Instant access after signup</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ Right Panel — Registration Form ═══ -->
        <div class="auth-form-panel">
            <div class="auth-form-wrapper">
                <div class="auth-form-header">
                    <h2 class="auth-form-title">Create Account</h2>
                    <p class="auth-form-subtitle">Fill in the details to get started</p>
                </div>

                <!-- Alert Box -->
                <div class="alert" id="alertBox">
                    <span class="alert__icon" id="alertIcon"></span>
                    <span class="alert__message" id="alertMessage"></span>
                    <button class="alert__close" onclick="hideAlert()">&times;</button>
                </div>

                <form class="auth-form" id="registerForm" novalidate>
                    <!-- Username Field -->
                    <div class="form-group" id="usernameGroup">
                        <label class="form-label" for="username">Username</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input
                                type="text"
                                id="username"
                                class="form-input"
                                placeholder="Choose a username"
                                autocomplete="username"
                                required
                            >
                        </div>
                        <span class="form-error" id="usernameError"></span>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group" id="emailGroup">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Min 8 chars, at least 1 number"
                                autocomplete="new-password"
                                required
                            >
                            <button type="button" class="form-toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="passwordError"></span>
                        <!-- Password Strength Meter -->
                        <div class="password-strength" id="passwordStrength">
                            <div class="password-strength__bar">
                                <div class="password-strength__fill" id="strengthFill"></div>
                            </div>
                            <span class="password-strength__label" id="strengthLabel"></span>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group" id="confirmPasswordGroup">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-input"
                                placeholder="Re-enter your password"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                        <span class="form-error" id="confirmPasswordError"></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn--primary btn--full" id="registerBtn">
                        <span class="btn__text">Create Account</span>
                        <span class="btn__loader" id="registerLoader">
                            <svg class="spinner" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="auth-form-footer">
                    <p>Already have an account? <a href="index.html" class="link">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
